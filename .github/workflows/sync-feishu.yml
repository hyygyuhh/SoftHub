name: Sync Feishu Base

# Syncs application data from the Feishu Base (多维表格) into js/apps-data.json
# so the GitHub Pages site reflects updates made in the Feishu document.
#
# Triggers:
#   - schedule: twice daily (08:00 and 20:00 Beijing time)
#   - workflow_dispatch: manual run from the Actions tab
on:
  schedule:
    # 0:00 and 12:00 UTC = 08:00 and 20:00 Asia/Shanghai
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping scheduled runs; a newer run cancels the older.
concurrency:
  group: sync-feishu
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Sync Feishu Base -> js/apps-data.json
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and set in repo variables if using international Lark:
          # FEISHU_API_HOST: https://open.larksuite.com
        run: node scripts/sync-feishu.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage synced data + downloaded icon/feature images from Feishu attachment fields.
          git add js/apps-data.json assets/icons/ assets/features/
          # Only commit if something is actually staged.
          if git diff --cached --quiet; then
            echo "No changes to js/apps-data.json, assets/icons/ or assets/features/ — skipping commit."
          else
            git commit -m "chore: sync apps data + icons/feature screenshots from Feishu Base (auto-synced by GitHub Actions workflow sync-feishu.yml)"
            git pull --rebase origin main
            git push
            echo "Pushed updated js/apps-data.json, assets/icons/ and assets/features/"
          fi
